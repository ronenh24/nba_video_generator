[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-video-generator"
version = "8.0.3"
authors = [
  { name="Ronen Huang", email="ronenhuang24@gmail.com" },
]
description = "Generates video highlights for an NBA player."
readme = "README.md"
requires-python = ">=3.15.1"
dependencies = [
    "av",
    "beautifulsoup4",
    "cryptography==46.0.3",
    "google-api-python-client",
    "google-auth-oauthlib",
    "httplib2",
    "numpy",
    "Pillow",
    "protobuf",
    "requests",
    "schedule",
    "selenium",
    "tzdata",
    "Unidecode",
    "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/ronenh24/nba_video_generator"
Issues = "https://github.com/ronenh24/nba_video_generator/issues"

[project.scripts]
nba-video-generator-web = "nba_video_generator.web:main"
